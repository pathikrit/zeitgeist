<!doctype html>
<html lang="en" data-astryx-theme="neutral">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zeitgeist</title>

<!-- Astryx components without a build step; stylesheet order and import map follow its "No build step (CDN)" recipe:
     https://github.com/meta/astryx/blob/main/packages/core/README.md -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.7.17/fonts.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.17/src/reset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/core@0.7.17/dist/astryx.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@astryxdesign/theme-neutral@0.7.17/dist/theme.css">
<link rel="stylesheet" href="https://kit.fontawesome.com/a22be8527e.css" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.css">
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.2.0",
    "react/jsx-runtime": "https://esm.sh/react@19.2.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@19.2.0",
    "react-dom/client": "https://esm.sh/react-dom@19.2.0/client",
    "@astryxdesign/core": "https://esm.sh/@astryxdesign/core@0.7.17?external=react,react-dom",
    "nouislider": "https://cdn.jsdelivr.net/npm/nouislider@15.8.1/dist/nouislider.min.mjs"
  }
}
</script>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; font-family: var(--font-family-body); background: var(--color-background-body); }
  /* The timeline index is a ruler (noUiSlider's "pips") along a line: a tick for each month, a longer labelled one for each year.
     A dot on the line marks the month being read and carries its name. Nothing is filled in, and a click anywhere on the ruler jumps there. */
  .timeline-index { height: 100%; box-sizing: border-box; padding-block: 12px; }
  .timeline-index .noUi-target {
    height: 100%; width: 100%; cursor: pointer;
    background: none; box-shadow: none; border: 0; border-radius: 0; border-left: 2px solid var(--color-border-emphasized);
  }
  .timeline-index .noUi-origin { left: 0; right: auto; }
  .timeline-index .noUi-handle {
    width: 12px; height: 12px; left: -7px; right: auto; bottom: -6px; cursor: grab;
    background: var(--color-icon-purple); box-shadow: none; border: 0; border-radius: var(--radius-full);
  }
  .timeline-index .noUi-handle::before, .timeline-index .noUi-handle::after { display: none; }
  .timeline-index .noUi-tooltip {
    left: 20px; right: auto; padding: 2px 8px; border: 0; border-radius: var(--radius-full);
    background: var(--color-background-purple); color: var(--color-text-purple);
    font-size: var(--text-supporting-size); font-weight: var(--font-weight-semibold);
  }
  .timeline-index .noUi-pips { left: 0; padding: 0; color: var(--color-text-secondary); font-size: var(--text-supporting-size); }
  .timeline-index .noUi-marker { width: 6px; height: 1px; margin-top: 0; background: var(--color-border-emphasized); }
  .timeline-index .noUi-marker-large { width: 16px; height: 2px; margin-top: -1px; background: var(--color-text-secondary); }
  .timeline-index .noUi-value { padding-left: 24px; }
  /* An outcome's bar takes its colour from its probability: see betColor(). An even bet is white on a dark page, grey on a light one */
  html { --bet-even: light-dark(var(--color-icon-disabled), var(--color-on-dark)); }
  .astryx-progress-bar-fill { background-color: var(--bet-color); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import {createElement as h, useEffect, useMemo, useRef, useState} from 'react';
import {createRoot} from 'react-dom/client';
import {
  Badge, Banner, Button, Card, Center, Collapsible, EmptyState, Grid, Heading, HStack, Layout, LayoutContent,
  LayoutHeader, LayoutPanel, Link, Markdown, ProgressBar, Spinner, Text,
  ToggleButton, ToggleButtonGroup, VStack, registerIcons, useMediaQuery,
} from '@astryxdesign/core';
import noUiSlider from 'nouislider';

const HORIZON_MONTHS = 60;        // the timeline index runs from this month to this many months ahead ...
const LATER = HORIZON_MONTHS + 1; // ... plus one last stop for whatever resolves after that, or has no date
const JUMP_SETTLE_MS = 200;       // after the index scrolls the timeline, ignore scroll events for this long
const INDEX_MIN_WIDTH = 720;      // page width in px from which the timeline index is shown
const INDEX_WIDTH = 112;          // px, the timeline index panel
const CARDS_WIDTH = 760;          // px, the cards beside the memo: room for two columns; the memo takes the rest
const MEMO_MIN_WIDTH = 1300;      // page width in px from which the memo is a column beside the cards
const YEAR_LABEL_CLEARANCE = 3;   // months before the index's "Later" in which a year label would collide with it
const QUESTIONS_PER_MONTH = 6;    // shown per month until "Show more" is pressed
const QUESTIONS_PER_PAGE = 24;
const CARD_MIN_WIDTH = 320;       // px; a narrower page gets fewer columns of cards
// The tags the report gives to questions and catalysts (TAGS in zeitgeist.py), each with a Badge colour and an icon.
// The tag bar shows them in this order.
const TAGS = {
  Geopolitical: {hue: 'red', icon: 'earth-americas'},
  Govt: {hue: 'pink', icon: 'landmark-dome'},
  Market: {hue: 'green', icon: 'arrow-trend-up'},
  Macro: {hue: 'blue', icon: 'chart-line'},
  Commodities: {hue: 'yellow', icon: 'coins'},
  Crypto: {hue: 'orange', icon: 'bitcoin-sign'},
  International: {hue: 'teal', icon: 'flag'},
  Calamities: {hue: 'cyan', icon: 'tornado'},
  Other: {hue: 'neutral', icon: 'tag'},
};
const ALL = 'All';                // the choice in the tag bar that shows every tag
const DATE_HUE = 'purple';        // Astryx colour names: month headings and card dates ...
const TITLE_HUE = 'blue';         // ... and card titles
const MAX_OUTCOMES = 4;           // shown per question; the rest sit behind "N more outcomes"
const MIN_PROBABILITY = 0.01;
const NEAR_CERTAIN = 0.98;

// ── Icons: Font Awesome duotone everywhere, including the ones Astryx draws inside its own components ──
// `hue` is one of Astryx's colour names (blue, orange, purple, ...); without it the icon takes the text colour
const fa = (name, hue) => h('i', {
  className: `fa-duotone fa-solid fa-${name}`, 'aria-hidden': true, style: hue && {color: `var(--color-icon-${hue})`},
});
const textColor = hue => ({color: `var(--color-text-${hue})`});
registerIcons(Object.fromEntries(Object.entries({
  close: 'xmark', chevronDown: 'chevron-down', chevronLeft: 'chevron-left', chevronRight: 'chevron-right',
  chevronsLeft: 'chevrons-left', chevronsRight: 'chevrons-right', check: 'check', success: 'circle-check',
  error: 'circle-xmark', warning: 'triangle-exclamation', info: 'circle-info', calendar: 'calendar', clock: 'clock',
  externalLink: 'arrow-up-right-from-square', menu: 'bars', moreHorizontal: 'ellipsis', search: 'magnifying-glass',
  upload: 'upload', arrowUp: 'arrow-up', arrowDown: 'arrow-down', arrowsUpDown: 'arrow-up-arrow-down',
  funnel: 'filter', eyeSlash: 'eye-slash', viewColumns: 'columns-3', copy: 'copy', checkDouble: 'check-double',
  wrench: 'wrench', stop: 'stop', microphone: 'microphone',
}).map(([name, icon]) => [name, fa(icon)])));

// ── Dates: everything is a YYYY-MM-DD string; months are counted from the month of the report ──
const monthNumber = iso => Number(iso.slice(0, 4)) * 12 + Number(iso.slice(5, 7)) - 1;
const utc = options => new Intl.DateTimeFormat('en-US', {timeZone: 'UTC', ...options});
const monthDate = number => new Date(Date.UTC(Math.floor(number / 12), number % 12, 1));
const longMonth = number => utc({month: 'long', year: 'numeric'}).format(monthDate(number));
const shortMonth = number => utc({month: 'short', year: 'numeric'}).format(monthDate(number));
const day = iso => utc({month: 'short', day: 'numeric', year: 'numeric'}).format(new Date(iso));
const dayOfMonth = iso => utc({month: 'short', day: 'numeric'}).format(new Date(iso));
const isDate = text => /^\d{4}-\d{2}-\d{2}$/.test(text);
const byDate = (a, b) => (a.date ?? '9999').localeCompare(b.date ?? '9999'); // undated last
const plural = (count, noun) => `${count.toLocaleString('en-US')} ${noun}${count === 1 ? '' : 's'}`;

// ── Questions ──
// The outcomes worth showing, most likely first
function outcomes(question) {
  let bets = (question.bets ?? []).filter(b => b.probability > MIN_PROBABILITY).sort((a, b) => b.probability - a.probability);
  // Yes/No markets: the leading side says it all
  if (bets.length === 2 && bets.every(b => /^(yes|no|up|down)$/i.test(b.prompt.trim()))) bets = bets.slice(0, 1);
  // A ladder ("above 3%", "above 3.25%", ...) has many near-certain rungs; only the least likely of them is informative
  const nearCertain = bets.filter(b => b.probability >= NEAR_CERTAIN).length;
  return nearCertain > 3 ? bets.slice(nearCertain - 1) : bets;
}

// The report is next to this page once published; from the repository root it is under .reports/
async function loadJson(file) {
  let response = await fetch(file);
  if (!response.ok) response = await fetch(`.reports/${file}`);
  if (!response.ok) throw new Error(`${file}: ${response.status} ${response.statusText}`);
  return response.json();
}

// Red at 0%, through white at 50%, to green at 100%
function betColor(probability) {
  const [end, share] = probability < 0.5 ? ['error', 1 - probability * 2] : ['success', probability * 2 - 1];
  return `color-mix(in oklab, var(--color-${end}) ${Math.round(share * 100)}%, var(--bet-even))`;
}

// ── Components ──
function Outcome({bet}) {
  return h(ProgressBar, {
    label: bet.prompt,
    value: Math.round(bet.probability * 100),
    hasValueLabel: true,
    formatValueLabel: value => `${value}%`,
    style: {'--bet-color': betColor(bet.probability)},
  });
}

// The date line of a card; the year is left out under a month heading, which already says it
function When({when, hasYear, icon}) {
  return h(Text, {type: 'supporting', weight: 'semibold', style: textColor(DATE_HUE)},
    fa(icon, DATE_HUE), ' ', !when ? 'No date' : !isDate(when) ? when : hasYear ? day(when) : dayOfMonth(when));
}

function Tag({tag}) {
  return TAGS[tag] ? h(Badge, {label: tag, variant: TAGS[tag].hue, icon: fa(TAGS[tag].icon)}) : null;
}

// The top line of a card: when, and which tag
function CardHeader({item, when, hasYear, icon}) {
  return h(HStack, {gap: 2, align: 'center', justify: 'between'}, h(When, {when, hasYear, icon}), h(Tag, {tag: item.tag}));
}

function Title({title, url}) {
  const look = {weight: 'semibold', style: textColor(TITLE_HUE)};
  return url ? h(Link, {href: url, target: '_blank', ...look}, title) : h(Text, look, title);
}

// A catalyst is a question's card without the outcomes, told apart by its icon; a vague `when`
// ("late January 2027") is shown as written
function Catalyst({catalyst, hasYear}) {
  return h(Card, null, h(VStack, {gap: 3},
    h(CardHeader, {item: catalyst, when: isDate(catalyst.when) ? catalyst.date : catalyst.when, hasYear, icon: 'bolt'}),
    h(Title, catalyst),
  ));
}

function Question({question, hasYear}) {
  const bets = question.outcomes;
  const rest = bets.slice(MAX_OUTCOMES);
  return h(Card, null, h(VStack, {gap: 3},
    h(CardHeader, {item: question, when: question.date, hasYear, icon: 'calendar-day'}),
    h(Title, question),
    bets.length === 0 && h(Text, {type: 'supporting'}, 'No outcome is priced above 1%'),
    ...bets.slice(0, MAX_OUTCOMES).map(bet => h(Outcome, {key: bet.prompt, bet})),
    rest.length > 0 && h(Collapsible, {trigger: h(Text, {type: 'supporting'}, plural(rest.length, 'more outcome')), defaultIsOpen: false},
      h(VStack, {gap: 3, paddingBlockStart: 3}, rest.map(bet => h(Outcome, {key: bet.prompt, bet}))),
    ),
  ));
}

function Month({group, maxColumns}) {
  const [shown, setShown] = useState(QUESTIONS_PER_MONTH);
  const {catalysts, questions} = group;
  const hasYear = group.bucket === LATER;
  const hidden = questions.length - shown;
  // Every catalyst and the first questions, in date order. Both lists are already in date order and the sort is
  // stable, so on the same day catalysts come first and questions stay most traded first.
  const cards = [...catalysts, ...questions.slice(0, shown)].sort(byDate);
  return h(VStack, {gap: 4, as: 'section', id: `month-${group.bucket}`},
    h(Heading, {level: 2, style: textColor(DATE_HUE)}, fa('calendar-days', DATE_HUE), ' ', group.label),
    h(Grid, {columns: {minWidth: CARD_MIN_WIDTH, max: maxColumns}, gap: 4}, cards.map(card => card.isCatalyst
      ? h(Catalyst, {key: `catalyst-${card.index}`, catalyst: card, hasYear})
      : h(Question, {key: card.id, question: card, hasYear}))),
    hidden > 0 && h(HStack, {justify: 'center'}, h(Button, {
      label: `Show ${Math.min(hidden, QUESTIONS_PER_PAGE)} more of ${hidden.toLocaleString('en-US')}`,
      variant: 'ghost',
      icon: fa('chevron-down'),
      onClick: () => setShown(shown + QUESTIONS_PER_PAGE),
    })),
  );
}

// The timeline index: a ruler of months, from the month of the report at the top to "Later" at the bottom, with a
// mark on the month being read. Dragging the mark, clicking the ruler or the arrow keys call onJump(month).
function TimelineIndex({month, thisMonth, onJump}) {
  const element = useRef(null);
  const jump = useRef(onJump);
  jump.current = onJump;
  const slidAt = useRef(0);

  useEffect(() => {
    const isJanuary = value => (thisMonth + value) % 12 === 0;
    const monthLabel = value => value === LATER ? 'Later' : shortMonth(thisMonth + Math.round(value));
    const ruler = noUiSlider.create(element.current, {
      orientation: 'vertical', range: {min: 0, max: LATER}, step: 1, start: 0,
      behaviour: 'tap-snap', // a click on the ruler moves the mark there, and it can be dragged on from that same click
      tooltips: {to: monthLabel},
      ariaFormat: {to: monthLabel},
      handleAttributes: [{'aria-label': 'Jump to month'}],
      pips: {
        mode: 'steps',
        density: 100, // no ticks between the months
        // 1 = a long tick with a label, 0 = a short tick
        filter: value => value === LATER || (isJanuary(value) && LATER - value > YEAR_LABEL_CLEARANCE) ? 1 : 0,
        format: {to: value => value === LATER ? 'Later' : String((thisMonth + value) / 12)},
      },
    });
    // 'slide' is only what the reader does (a drag, a click, an arrow key), not set() below
    ruler.on('slide', (_formatted, _handle, [value]) => { slidAt.current = performance.now(); jump.current(Math.round(value)); });
    // The month name beside the mark would half cover a year label that is right next to it
    ruler.on('update', (_formatted, _handle, [value]) => element.current.querySelectorAll('.noUi-value').forEach(label => {
      label.style.visibility = Math.abs(label.dataset.value - value) <= 1 ? 'hidden' : '';
    }));
    return () => ruler.destroy();
  }, [thisMonth]);

  // Follow the month being read. Right after the reader moved the mark, `month` can still be an older value on its way
  // through React; set() would then pull the mark from under the pointer and freeze it for a moment.
  useEffect(() => {
    const ruler = element.current.noUiSlider;
    if (performance.now() - slidAt.current > JUMP_SETTLE_MS && Math.round(ruler.get(true)) !== month) ruler.set(month, false);
  }, [month, thisMonth]);

  return h('div', {className: 'timeline-index'}, h('div', {ref: element}));
}

// The memo: the combined one, or the memo of the selected tag
function Memo({memos, tag}) {
  if (!memos) return h(EmptyState, {isCompact: true, icon: fa('file-lines fa-xl'), title: 'No memo yet', description: 'A new one is written every few days.'});
  const markdown = tag === ALL ? memos.summary : memos.tags[tag];
  const openInNewTab = href => { window.open(href, '_blank', 'noopener'); return false; };
  return h(VStack, {gap: 4},
    h(HStack, {gap: 3, align: 'center'},
      h(Text, {type: 'supporting', weight: 'semibold', style: textColor(DATE_HUE)}, fa('file-lines', DATE_HUE), ' ', day(memos.date)),
      h(Tag, {tag}),
    ),
    markdown
      ? h(Markdown, {density: 'compact', contentWidth: '100%', onLinkClick: openInNewTab}, markdown)
      : h(Text, {type: 'supporting'}, 'No memo.'),
  );
}

function App() {
  const [report, setReport] = useState(null);
  const [error, setError] = useState(null);
  const [month, setMonth] = useState(0); // where the timeline index points, in months from now
  const timeline = useRef(null);
  const jumpedAt = useRef(0);
  const [tag, setTag] = useState(ALL); // the one tag to show, or all of them
  const isWide = useMediaQuery(`(min-width: ${INDEX_MIN_WIDTH}px)`); // a phone has no room for the index beside the cards
  const hasMemoColumn = useMediaQuery(`(min-width: ${MEMO_MIN_WIDTH}px)`); // on a narrower page the memo folds away above the cards

  useEffect(() => { loadJson('output.json').then(setReport, setError); }, []);

  const items = useMemo(() => {
    if (!report) return null;
    const thisMonth = monthNumber(report.date);
    const bucket = iso => iso ? Math.min(Math.max(monthNumber(iso) - thisMonth, 0), LATER) : LATER;
    const isPastDue = p => p.resolution_date && p.resolution_date < report.date; // still open on the platform, but no longer ahead of us
    return {
      thisMonth,
      questions: (report.relevant_predictions ?? []).filter(p => !isPastDue(p)).map(p => ({
        ...p,
        bucket: bucket(p.resolution_date),
        date: p.resolution_date,
        outcomes: outcomes(p),
      })).sort((a, b) => byDate(a, b) || b.volume_24h - a.volume_24h), // most traded first within a day
      catalysts: (report.upcoming_catalysts ?? []).map((c, index) => ({
        ...c, index, isCatalyst: true, date: c.expected_date, bucket: bucket(c.expected_date),
      })).sort(byDate),
    };
  }, [report]);

  const groups = useMemo(() => {
    if (!items) return [];
    const byBucket = new Map();
    for (const kind of ['questions', 'catalysts']) {
      for (const item of items[kind]) {
        if (tag !== ALL && item.tag !== tag) continue;
        if (!byBucket.has(item.bucket)) byBucket.set(item.bucket, {bucket: item.bucket, questions: [], catalysts: []});
        byBucket.get(item.bucket)[kind].push(item);
      }
    }
    return [...byBucket.values()].sort((a, b) => a.bucket - b.bucket).map(group => ({
      ...group, label: group.bucket === LATER ? 'Later' : longMonth(items.thisMonth + group.bucket),
    }));
  }, [items, tag]);

  // Scrolling the timeline moves the index to the month being read ...
  useEffect(() => {
    const scroller = timeline.current;
    if (!scroller) return;
    const onScroll = () => {
      if (performance.now() - jumpedAt.current < JUMP_SETTLE_MS) return; // the index itself scrolled here
      const readingLine = scroller.getBoundingClientRect().top + scroller.clientHeight / 3;
      // At the very top the first month is the one being read, however short it is
      const reading = scroller.scrollTop > 0 && groups.findLast(group => document.getElementById(`month-${group.bucket}`).getBoundingClientRect().top <= readingLine);
      setMonth((reading || groups[0])?.bucket ?? 0);
    };
    onScroll(); // the content just changed (first load, a different tag), so the month being read may have too
    scroller.addEventListener('scroll', onScroll, {passive: true});
    return () => scroller.removeEventListener('scroll', onScroll);
  }, [groups]);

  // ... and moving the index scrolls the timeline to that month, or to the next one that has anything in it
  const jumpTo = value => {
    setMonth(value);
    jumpedAt.current = performance.now();
    const group = groups.find(group => group.bucket >= value) ?? groups.at(-1);
    if (group) document.getElementById(`month-${group.bucket}`).scrollIntoView();
  };

  if (error) {
    return h(Center, {height: '100%', padding: 6}, h(Banner, {
      status: 'error',
      title: 'Could not load the report',
      description: `${error.message}. If you opened this file directly, serve it instead: python3 -m http.server 8000`,
    }));
  }
  if (!items) return h(Center, {height: '100%'}, h(Spinner, {size: 'xl', label: 'Loading the report'}));

  const memo = h(Memo, {memos: report.memos, tag});
  const tagsInUse = new Set([...items.questions, ...items.catalysts].map(item => item.tag)); // a tag that nothing has gets no chip

  return h(Layout, {
    contentWidth: 1680,
    header: h(LayoutHeader, {hasDivider: true},
      h(HStack, {gap: 4, align: 'center', justify: 'between', wrap: 'wrap'},
        h(Heading, {level: 3, accessibilityLevel: 1}, fa('crystal-ball'), ' Zeitgeist'),
        // One tag at a time; "All" is the default, and pressing the selected tag again goes back to it
        h(ToggleButtonGroup, {label: 'Tag', type: 'single', value: tag, onChange: value => setTag(value ?? ALL), size: 'sm'},
          h(ToggleButton, {value: ALL, label: ALL, icon: fa('layer-group')}),
          Object.entries(TAGS).filter(([name]) => tagsInUse.has(name)).map(([name, {hue, icon}]) => h(ToggleButton, {
            key: name, value: name, label: name, icon: fa(icon, hue === 'neutral' ? 'gray' : hue),
          })),
        ),
      ),
    ),
    start: isWide && h(LayoutPanel, {width: INDEX_WIDTH, isScrollable: false, role: 'navigation', label: 'Timeline index'},
      h(TimelineIndex, {month, thisMonth: items.thisMonth, onJump: jumpTo}),
    ),
    content: h(LayoutContent, {label: 'Timeline', ref: timeline}, h(VStack, {gap: 8},
      !hasMemoColumn && h(Collapsible, {trigger: 'Memo', defaultIsOpen: false}, memo),
      groups.length === 0
        ? h(EmptyState, {icon: fa('telescope fa-2xl'), title: 'Nothing to show'})
        : groups.map(group => h(Month, {key: group.bucket, group, maxColumns: hasMemoColumn ? 2 : 3})),
    )),
    end: hasMemoColumn && h(LayoutPanel, {
      width: `calc(100% - ${INDEX_WIDTH + CARDS_WIDTH}px)`, hasDivider: true, role: 'complementary', label: 'Memo',
    }, memo),
  });
}

createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
