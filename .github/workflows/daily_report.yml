name: Daily Report

on:
  workflow_dispatch: # enables to manually trigger this job
  schedule:
    - cron: '0 11 * * *' # Daily at 6am ET (11am UTC during EST)

jobs:
  report:
    name: Make report
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      # The database (cached relevance scores + daily snapshots) lives as an asset on the "data" release
      - name: Restore database
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if assets=$(gh release view data --json assets --jq '.assets[].name' 2>&1); then
            if grep -qx zeitgeist.db <<< "$assets"; then
              gh release download data --pattern zeitgeist.db --dir .data
            fi
          elif grep -q "release not found" <<< "$assets"; then
            echo "No database yet; starting fresh"
          else
            echo "$assets"; exit 1 # do not start fresh (and later overwrite the database) on a transient error
          fi

      - name: Generate report
        run: uv run python zeitgeist.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Save database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data > /dev/null 2>&1 || gh release create data --title "Data" --notes "SQLite database maintained by the daily report" --latest=false
          gh release upload data .data/zeitgeist.db --clobber

      - name: Publish report
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          publish_dir: .reports
          keep_files: true
